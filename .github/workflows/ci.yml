name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.18.1'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Prisma Generate
      run: npx prisma generate

    - name: Lint Code
      run: npm run lint

    - name: Run Unit & Integration Tests
      run: npm test

    - name: Build Application
      run: npm run build
      env:
        # We define a dummy secret here to pass Zod configuration checks at build time,
        # but Next.js will NOT bake this into the image for server components.
        JWT_SECRET: "ci-dummy-secret-minimum-32-chars-long"
        ENCRYPTION_KEY: "ci-dummy-encryption-key-32-chars"
        DATABASE_URL: "postgres://dummy:dummy@localhost:5432/dummy"
        NEXT_PHASE: "phase-production-build"

  docker:
    name: Build Docker Image
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: vorynex-automation:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
